<!DOCTYPE html>
<html lang="fr" data-bs-theme="{{ session.get('theme','light') }}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Chat avec {{ interlocuteur }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>.msg-moi{background:#1877f2;color:white;border-radius:18px 18px 4px 18px;padding:8px 14px;max-width:70%;margin-left:auto;}
.msg-lui{background:#e4e6eb;border-radius:18px 18px 18px 4px;padding:8px 14px;max-width:70%;}</style></head>
<body class="bg-body">
<nav class="navbar navbar-dark bg-primary sticky-top"><div class="container"><a class="navbar-brand fw-bold" href="/messages">⬅️ {{ interlocuteur }}</a></div></nav>
<div class="container py-4" style="max-width:500px;">
    <div style="max-height:60vh;overflow-y:auto;" class="mb-3">
        {% for m in msgs %}
        <div class="mb-2 d-flex {% if m[0]==utilisateur_connecte %}justify-content-end{% endif %}">
            <div class="{% if m[0]==utilisateur_connecte %}msg-moi{% else %}msg-lui{% endif %}">
                {{ m[1] }}<br><small style="opacity:.7;">{{ m[2] | temps_relatif }}</small>
            </div>
        </div>
        {% endfor %}
    </div>
    <form method="POST" class="d-flex gap-2">
        <input type="text" name="contenu" class="form-control" style="border-radius:20px;" placeholder="Écris un message..." required>
        <button class="btn btn-primary" style="border-radius:20px;">Envoyer</button>
    </form>
</div>
</body></html>
