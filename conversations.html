<!DOCTYPE html>
<html lang="fr" data-bs-theme="{{ session.get('theme','light') }}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Messages</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-body">
<nav class="navbar navbar-dark bg-primary sticky-top"><div class="container"><a class="navbar-brand fw-bold" href="/">💬 MicroBlog</a><a href="/" class="btn btn-outline-light btn-sm">⬅️ Fil</a></div></nav>
<div class="container py-4" style="max-width:500px;">
    <h4 class="mb-3">💬 Mes Conversations</h4>
    {% for conv in convs %}
    <a href="/messages/{{ conv[0] }}" class="card mb-2 p-3 text-decoration-none text-body d-flex align-items-center gap-3">
        <img src="https://ui-avatars.com/api/?name={{ conv[0] }}&size=42" class="rounded-circle" style="width:42px;height:42px;">
        <strong>{{ conv[0] }}</strong>
    </a>
    {% else %}<p class="text-muted text-center">Aucune conversation.</p>{% endfor %}
</div>
</body></html>
