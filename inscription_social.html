<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card p-4" style="width: 380px;">
        <h3 class="text-center mb-3">📝 Créer un compte</h3>
        {% with messages_flash = get_flashed_messages(with_categories=true) %}
            {% for categorie, message in messages_flash %}
                <div class="alert alert-{{ categorie }} py-2">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="pseudo" class="form-control mb-2" placeholder="Pseudo (3-20 caractères : lettres, chiffres, _ .)" maxlength="20" autocomplete="username" required>
            <input type="password" name="mot_de_passe" class="form-control mb-3" placeholder="Mot de passe (min 8 caractères)" autocomplete="new-password" required minlength="8">
            <button type="submit" class="btn btn-success w-100 fw-bold">S'inscrire</button>
        </form>
        <p class="text-center mt-3 mb-0"><a href="/connexion">Déjà inscrit ? Se connecter</a></p>
        <p class="text-center"><a href="/">⬅️ Retour</a></p>
    </div>
</body>
</html>
