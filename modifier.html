<!DOCTYPE html>
<html lang="fr" data-bs-theme="{{ session.get('theme', 'light') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le message - MicroBlog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card { border-radius: 12px; }
    </style>
</head>
<body class="bg-body d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">💬 MicroBlog</a>
            <a href="/" class="btn btn-outline-light btn-sm">⬅️ Annuler et retour</a>
        </div>
    </nav>

    <!-- FORMULAIRE DE MODIFICATION -->
    <div class="container py-5 d-flex justify-content-center align-items-center flex-grow-1">
        <div class="card p-4 shadow-sm" style="width: 100%; max-width: 550px;">
            <h4 class="mb-3 fw-bold text-primary">✏️ Modifier ton message</h4>
            
            <form method="POST">
                <div class="mb-3">
                    <textarea name="message" class="form-control" rows="5" maxlength="500" placeholder="Écris ton message..." required>{{ message[2] }}</textarea>
                    <div class="d-flex justify-content-between mt-1">
                        <small class="text-muted">Auteur : <b>{{ message[1] }}</b></small>
                        <small class="text-muted">500 caractères max</small>
                    </div>
                </div>
                
                <div class="d-flex justify-content-between gap-2">
                    <a href="/" class="btn btn-outline-secondary">Annuler</a>
                    <button type="submit" class="btn btn-warning fw-bold">💾 Sauvegarder</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
